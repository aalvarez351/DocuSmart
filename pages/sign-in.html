  <!-- Control Center for Material Dashboard: parallax effects, scripts for the example pages etc -->

  <script>
    const apiUrl = window.location.hostname === 'localhost' ? 
      'http://localhost:3000/api' : 
      'https://docusmart.onrender.com/api';
    
    // Verificar si ya está logueado
    document.addEventListener('DOMContentLoaded', function() {
      const token = localStorage.getItem('docusmart_token');
      if (token) {
        window.location.href = 'dashboard.html';
      }
    });
    
    // Manejar el formulario de login
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const loginBtn = document.getElementById('loginBtn');
      const loginText = document.getElementById('loginText');
      const loginSpinner = document.getElementById('loginSpinner');
      const errorMessage = document.getElementById('error-message');
      
      // Mostrar loading
      loginBtn.disabled = true;
      loginText.classList.add('d-none');
      loginSpinner.classList.remove('d-none');
      errorMessage.classList.add('d-none');
      
      try {
        const response = await fetch(apiUrl + '/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email, password })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // Guardar token
          localStorage.setItem('docusmart_token', data.token);
          
          // Redirigir al dashboard
          window.location.href = 'dashboard.html';
        } else {
          // Mostrar error
          errorMessage.textContent = data.message || 'Error al iniciar sesión';
          errorMessage.classList.remove('d-none');
        }
      } catch (error) {
        console.error('Error:', error);
        errorMessage.textContent = 'Error de conexión. Verifica que el servidor esté ejecutándose.';
        errorMessage.classList.remove('d-none');
      } finally {
        // Ocultar loading
        loginBtn.disabled = false;
        loginText.classList.remove('d-none');
        loginSpinner.classList.add('d-none');
      }
    });
  </script>
