<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>DocuSmart - Clientes</title>
  <link rel="stylesheet" type="text/css" href="https://fonts.googleapis.com/css?family=Inter:300,400,500,600,700,900" />
  <link href="../assets/css/nucleo-icons.css" rel="stylesheet" />
  <script src="https://kit.fontawesome.com/42d5adcbca.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
  <link id="pagestyle" href="../assets/css/material-dashboard.css?v=3.2.0" rel="stylesheet" />
</head>

<body class="g-sidenav-show bg-gray-100">
  <aside class="sidenav navbar navbar-vertical navbar-expand-xs border-radius-lg fixed-start ms-2 bg-white my-2">
    <div class="sidenav-header">
      <a class="navbar-brand px-4 py-3 m-0" href="dashboard.html">
        <img src="../assets/img/logo-ct-dark.png" class="navbar-brand-img" width="26" height="26" alt="main_logo">
        <span class="ms-1 text-sm text-dark">DocuSmart</span>
      </a>
    </div>
    <hr class="horizontal dark mt-0 mb-2">
    <div class="collapse navbar-collapse w-auto">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link text-dark" href="dashboard.html">
            <i class="material-symbols-rounded opacity-5">dashboard</i>
            <span class="nav-link-text ms-1">Panel de Control</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active bg-gradient-primary text-white" href="clientes.html">
            <i class="material-symbols-rounded opacity-5">people</i>
            <span class="nav-link-text ms-1">Clientes</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="productos.html">
            <i class="material-symbols-rounded opacity-5">inventory</i>
            <span class="nav-link-text ms-1">Productos</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="facturas.html">
            <i class="material-symbols-rounded opacity-5">receipt_long</i>
            <span class="nav-link-text ms-1">Facturas</span>
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link text-dark" href="contratos.html">
            <i class="material-symbols-rounded opacity-5">description</i>
            <span class="nav-link-text ms-1">Contratos IA</span>
          </a>
        </li>
      </ul>
    </div>
  </aside>

  <main class="main-content position-relative max-height-vh-100 h-100 border-radius-lg">
    <nav class="navbar navbar-main navbar-expand-lg px-0 mx-3 shadow-none border-radius-xl">
      <div class="container-fluid py-1 px-3">
        <nav aria-label="breadcrumb">
          <ol class="breadcrumb bg-transparent mb-0 pb-0 pt-1 px-0 me-sm-6 me-5">
            <li class="breadcrumb-item text-sm"><a class="opacity-5 text-dark" href="dashboard.html">DocuSmart</a></li>
            <li class="breadcrumb-item text-sm text-dark active">Clientes</li>
          </ol>
        </nav>
        <div class="collapse navbar-collapse mt-sm-0 mt-2 me-md-0 me-sm-4">
          <div class="ms-md-auto pe-md-3 d-flex align-items-center">
            <button class="btn bg-gradient-primary" onclick="showAddClientModal()">
              <i class="material-symbols-rounded me-2">add</i>
              Nuevo Cliente
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div class="container-fluid py-2">
      <div class="row">
        <div class="col-12">
          <div class="card my-4">
            <div class="card-header p-0 position-relative mt-n4 mx-3 z-index-2">
              <div class="bg-gradient-primary shadow-primary border-radius-lg pt-4 pb-3">
                <h6 class="text-white text-capitalize ps-3">Gestión de Clientes</h6>
              </div>
            </div>
            <div class="card-body px-0 pb-2">
              <div class="table-responsive p-0">
                <table class="table align-items-center mb-0">
                  <thead>
                    <tr>
                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7">Cliente</th>
                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">RUC/Cédula</th>
                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">Email</th>
                      <th class="text-uppercase text-secondary text-xxs font-weight-bolder opacity-7 ps-2">Teléfono</th>
                      <th class="text-secondary opacity-7">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="clientes-table">
                    <tr>
                      <td colspan="5" class="text-center py-4">
                        <p class="text-sm mb-0">No hay clientes registrados</p>
                        <button class="btn btn-sm bg-gradient-primary mt-2" onclick="showAddClientModal()">
                          Agregar Primer Cliente
                        </button>
                      </td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Modal Agregar Cliente -->
  <div class="modal fade" id="addClientModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Nuevo Cliente</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="clientForm">
            <div class="input-group input-group-outline mb-3">
              <label class="form-label">Nombre Completo</label>
              <input type="text" class="form-control" id="nombre" required>
            </div>
            <div class="input-group input-group-outline mb-3">
              <label class="form-label">RUC o Cédula</label>
              <input type="text" class="form-control" id="rucIdentidad" required>
            </div>
            <div class="input-group input-group-outline mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" id="email">
            </div>
            <div class="input-group input-group-outline mb-3">
              <label class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="telefono">
            </div>
            <div class="input-group input-group-outline mb-3">
              <label class="form-label">Dirección</label>
              <textarea class="form-control" id="direccion" rows="3"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn bg-gradient-primary" onclick="saveClient()">Guardar Cliente</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/material-dashboard.min.js"></script>
  
  <script>
    let apiUrl = window.location.hostname === 'localhost' ? 
      'http://localhost:3000/api' : 
      'https://docusmart.onrender.com/api';
    
    let clients = [];
    let editingClient = null;

    document.addEventListener('DOMContentLoaded', function() {
      checkAuth();
      loadClients();
    });

    function checkAuth() {
      const token = localStorage.getItem('docusmart_token');
      if (!token) {
        window.location.href = 'sign-in.html';
      }
    }

    function showAddClientModal() {
      editingClient = null;
      document.querySelector('#addClientModal .modal-title').textContent = 'Nuevo Cliente';
      document.getElementById('clientForm').reset();
      const modal = new bootstrap.Modal(document.getElementById('addClientModal'));
      modal.show();
    }

    async function saveClient() {
      const client = {
        nombre: document.getElementById('nombre').value,
        rucIdentidad: document.getElementById('rucIdentidad').value,
        email: document.getElementById('email').value,
        telefono: document.getElementById('telefono').value,
        direccion: document.getElementById('direccion').value
      };

      try {
        const token = localStorage.getItem('docusmart_token');
        const url = editingClient ? 
          `${apiUrl}/clientes/${editingClient}` : 
          `${apiUrl}/clientes`;
        const method = editingClient ? 'PUT' : 'POST';
        
        const response = await fetch(url, {
          method,
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + token
          },
          body: JSON.stringify(client)
        });

        if (response.ok) {
          const modal = bootstrap.Modal.getInstance(document.getElementById('addClientModal'));
          modal.hide();
          document.getElementById('clientForm').reset();
          loadClients();
          alert('Cliente guardado exitosamente');
        } else {
          throw new Error('Error guardando cliente');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error guardando cliente');
      }
    }

    async function loadClients() {
      try {
        const token = localStorage.getItem('docusmart_token');
        const response = await fetch(`${apiUrl}/clientes`, {
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (response.ok) {
          clients = await response.json();
          renderClients();
        } else {
          throw new Error('Error cargando clientes');
        }
      } catch (error) {
        console.error('Error:', error);
        renderClients();
      }
    }

    function renderClients() {
      const tbody = document.getElementById('clientes-table');
      
      if (clients.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="5" class="text-center py-4">
              <p class="text-sm mb-0">No hay clientes registrados</p>
              <button class="btn btn-sm bg-gradient-primary mt-2" onclick="showAddClientModal()">
                Agregar Primer Cliente
              </button>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = clients.map(client => `
        <tr>
          <td>
            <div class="d-flex px-2 py-1">
              <div class="d-flex flex-column justify-content-center">
                <h6 class="mb-0 text-sm">${client.nombre}</h6>
                <p class="text-xs text-secondary mb-0">${client.direccion || 'Sin dirección'}</p>
              </div>
            </div>
          </td>
          <td>
            <p class="text-xs font-weight-bold mb-0">${client.rucIdentidad}</p>
          </td>
          <td>
            <p class="text-xs font-weight-bold mb-0">${client.email || 'Sin email'}</p>
          </td>
          <td>
            <p class="text-xs font-weight-bold mb-0">${client.telefono || 'Sin teléfono'}</p>
          </td>
          <td class="align-middle">
            <button class="btn btn-link text-secondary mb-0" onclick="editClient('${client._id}')">
              <i class="material-symbols-rounded text-sm">edit</i>
            </button>
            <button class="btn btn-link text-danger mb-0" onclick="deleteClient('${client._id}')">
              <i class="material-symbols-rounded text-sm">delete</i>
            </button>
          </td>
        </tr>
      `).join('');
    }

    function editClient(id) {
      const client = clients.find(c => c._id === id);
      if (!client) return;
      
      editingClient = id;
      document.querySelector('#addClientModal .modal-title').textContent = 'Editar Cliente';
      
      document.getElementById('nombre').value = client.nombre;
      document.getElementById('rucIdentidad').value = client.rucIdentidad;
      document.getElementById('email').value = client.email || '';
      document.getElementById('telefono').value = client.telefono || '';
      document.getElementById('direccion').value = client.direccion || '';
      
      const modal = new bootstrap.Modal(document.getElementById('addClientModal'));
      modal.show();
    }

    async function deleteClient(id) {
      if (!confirm('¿Estás seguro de eliminar este cliente?')) return;
      
      try {
        const token = localStorage.getItem('docusmart_token');
        const response = await fetch(`${apiUrl}/clientes/${id}`, {
          method: 'DELETE',
          headers: {
            'Authorization': 'Bearer ' + token
          }
        });

        if (response.ok) {
          loadClients();
          alert('Cliente eliminado');
        } else {
          throw new Error('Error eliminando cliente');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error eliminando cliente');
      }
    }
  </script>
</body>
</html>
