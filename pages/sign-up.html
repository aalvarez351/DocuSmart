  <main class="main-content  mt-0">
    <section>
      <div class="page-header min-vh-100">
        <div class="container">
          <div class="row">
            <div class="col-6 d-lg-flex d-none h-100 my-auto pe-0 position-absolute top-0 start-0 text-center justify-content-center flex-column">
              <div class="position-relative bg-gradient-primary h-100 m-3 px-7 border-radius-lg d-flex flex-column justify-content-center" style="background-image: url('../assets/img/illustrations/illustration-signup.jpg'); background-size: cover;">
              </div>
            </div>
            <div class="col-xl-4 col-lg-5 col-md-7 d-flex flex-column ms-auto me-auto ms-lg-auto me-lg-5">
              <div class="card card-plain">
                <div class="card-header">
                  <h4 class="font-weight-bolder">Registrar Empresa</h4>
                  <p class="mb-0">Crea tu cuenta empresarial en DocuSmart</p>
                </div>
                <div class="card-body">
                  <div id="error-message" class="alert alert-danger d-none" role="alert"></div>
                  <div id="success-message" class="alert alert-success d-none" role="alert"></div>
                  
                  <form role="form" id="registerForm">
                    <!-- Datos de la Empresa -->
                    <h6 class="text-primary mb-3">Datos de la Empresa</h6>
                    <div class="input-group input-group-outline mb-3">
                      <label class="form-label">Nombre de la Empresa *</label>
                      <input type="text" class="form-control" id="empresaNombre" required>
                    </div>
                    <div class="row">
                      <div class="col-md-6">
                        <div class="input-group input-group-outline mb-3">
                          <label class="form-label">RUC de la Empresa *</label>
                          <input type="text" class="form-control" id="empresaRuc" placeholder="8-123-456789" required>
                        </div>
                      </div>
                      <div class="col-md-6">
                        <div class="input-group input-group-outline mb-3">
                          <label class="form-label">Email de la Empresa *</label>
                          <input type="email" class="form-control" id="empresaEmail" required>
                        </div>
                      </div>
                    </div>
                    <div class="input-group input-group-outline mb-3">
                      <label class="form-label">Dirección</label>
                      <input type="text" class="form-control" id="empresaDireccion">
                    </div>
                    <div class="input-group input-group-outline mb-3">
                      <label class="form-label">Teléfono</label>
                      <input type="text" class="form-control" id="empresaTelefono">
                    </div>
                    
                    <!-- Datos del Usuario Admin -->
                    <h6 class="text-primary mb-3 mt-4">Datos del Administrador</h6>
                    <div class="input-group input-group-outline mb-3">
                      <label class="form-label">Nombre Completo *</label>
                      <input type="text" class="form-control" id="usuarioNombre" required>
                    </div>
                    <div class="input-group input-group-outline mb-3">
                      <label class="form-label">Correo Electrónico *</label>
                      <input type="email" class="form-control" id="usuarioEmail" required>
                    </div>
                    <div class="input-group input-group-outline mb-3">
                      <label class="form-label">Contraseña *</label>
                      <input type="password" class="form-control" id="usuarioPassword" required>
                    </div>
                    <div class="input-group input-group-outline mb-3">
                      <label class="form-label">Confirmar Contraseña *</label>
                      <input type="password" class="form-control" id="confirmarPassword" required>
                    </div>
                    
                    <!-- Plan -->
                    <div class="input-group input-group-outline mb-3">
                      <select class="form-control" id="plan">
                        <option value="basico">Plan Básico - $15/mes</option>
                        <option value="pro">Plan Pro - $30/mes</option>
                        <option value="enterprise">Plan Enterprise - $80/mes</option>
                      </select>
                    </div>
                    
                    <div class="form-check form-check-info text-start ps-0">
                      <input class="form-check-input" type="checkbox" id="aceptarTerminos" required>
                      <label class="form-check-label" for="aceptarTerminos">
                        Acepto los <a href="javascript:;" class="text-dark font-weight-bolder">Términos y Condiciones</a> *
                      </label>
                    </div>
                    <div class="text-center">
                      <button type="submit" class="btn btn-lg bg-gradient-primary btn-lg w-100 mt-4 mb-0" id="registerBtn">
                        <span id="registerText">Registrar Empresa</span>
                        <span id="registerSpinner" class="spinner-border spinner-border-sm d-none ms-2"></span>
                      </button>
                    </div>
                  </form>
                </div>
                <div class="card-footer text-center pt-0 px-lg-2 px-1">
                  <p class="mb-2 text-sm mx-auto">
                    ¿Ya tienes una cuenta?
                    <a href="../pages/sign-in.html" class="text-primary text-gradient font-weight-bold">Iniciar Sesión</a>
                  </p>
                </div>

  <!--   Core JS Files   -->
  <script src="../assets/js/core/popper.min.js"></script>
  <script src="../assets/js/core/bootstrap.min.js"></script>
  <script src="../assets/js/plugins/perfect-scrollbar.min.js"></script>
  <script src="../assets/js/plugins/smooth-scrollbar.min.js"></script>
  <script>
    let apiUrl = window.location.hostname === 'localhost' ? 
      'http://localhost:3000/api' : 
      'https://docusmart.onrender.com/api';
    
    document.addEventListener('DOMContentLoaded', function() {
      // Verificar si ya está logueado
      const token = localStorage.getItem('docusmart_token');
      if (token) {
        window.location.href = 'dashboard.html';
      }
      
      // Manejar el formulario de registro
      document.getElementById('registerForm').addEventListener('submit', handleRegister);
      
      // Inicializar PerfectScrollbar solo si el elemento existe
      var scrollElement = document.querySelector('#sidenav-scrollbar');
      if (scrollElement && typeof Scrollbar !== 'undefined') {
        var options = { damping: '0.5' };
        Scrollbar.init(scrollElement, options);
      }
    });
    
    async function handleRegister(e) {
      e.preventDefault();
      
      const btn = document.getElementById('registerBtn');
      const text = document.getElementById('registerText');
      const spinner = document.getElementById('registerSpinner');
      const errorMessage = document.getElementById('error-message');
      const successMessage = document.getElementById('success-message');
      
      // Ocultar mensajes previos
      errorMessage.classList.add('d-none');
      successMessage.classList.add('d-none');
      
      // Validar contraseñas
      const password = document.getElementById('usuarioPassword').value;
      const confirmPassword = document.getElementById('confirmarPassword').value;
      
      if (password !== confirmPassword) {
        showError('Las contraseñas no coinciden');
        return;
      }
      
      if (password.length < 6) {
        showError('La contraseña debe tener al menos 6 caracteres');
        return;
      }
      
      // Validar RUC
      const ruc = document.getElementById('empresaRuc').value;
      if (!validateRUC(ruc)) {
        showError('Formato de RUC inválido. Use el formato: 8-123-456789');
        return;
      }
      
      // Mostrar loading
      btn.disabled = true;
      text.classList.add('d-none');
      spinner.classList.remove('d-none');
      
      try {
        const registerData = {
          empresa: {
            nombre: document.getElementById('empresaNombre').value,
            ruc: document.getElementById('empresaRuc').value,
            email: document.getElementById('empresaEmail').value,
            direccion: document.getElementById('empresaDireccion').value,
            telefono: document.getElementById('empresaTelefono').value,
            plan: document.getElementById('plan').value
          },
          usuario: {
            nombre: document.getElementById('usuarioNombre').value,
            email: document.getElementById('usuarioEmail').value,
            password: password
          }
        };
        
        const response = await fetch(apiUrl + '/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(registerData)
        });
        
        const data = await response.json();
        
        if (response.ok) {
          // Guardar token
          localStorage.setItem('docusmart_token', data.token);
          
          // Mostrar mensaje de éxito
          showSuccess('Empresa registrada exitosamente. Redirigiendo...');
          
          // Redirigir al dashboard después de 2 segundos
          setTimeout(() => {
            window.location.href = 'dashboard.html';
          }, 2000);
        } else {
          showError(data.message || 'Error al registrar la empresa');
        }
      } catch (error) {
        console.error('Error:', error);
        showError('Error de conexión. Verifica que el servidor esté funcionando.');
      } finally {
        // Ocultar loading
        btn.disabled = false;
        text.classList.remove('d-none');
        spinner.classList.add('d-none');
      }
    }
    
    function validateRUC(ruc) {
      // Formato RUC panameño: X-XXX-XXXXXX
      const rucPattern = /^\d{1,2}-\d{1,4}-\d{1,6}$/;
      return rucPattern.test(ruc);
    }
    
    function showError(message) {
      const errorMessage = document.getElementById('error-message');
      errorMessage.textContent = message;
      errorMessage.classList.remove('d-none');
      
      // Scroll al top para mostrar el mensaje
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    
    function showSuccess(message) {
      const successMessage = document.getElementById('success-message');
      successMessage.textContent = message;
      successMessage.classList.remove('d-none');
      
      // Scroll al top para mostrar el mensaje
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }
  </script>
  <!-- Github buttons -->
  <script async defer src="https://buttons.github.io/buttons.js"></script>
  <!-- Control Center for Material Dashboard: parallax effects, scripts for the example pages etc -->
  <script>
    // Override PerfectScrollbar initialization to prevent errors
    window.addEventListener('DOMContentLoaded', function() {
      // Disable automatic PerfectScrollbar initialization
      if (typeof Scrollbar !== 'undefined') {
        const originalInit = Scrollbar.init;
        Scrollbar.init = function(element, options) {
          if (element && element.nodeType === 1) {
            try {
              return originalInit.call(this, element, options);
            } catch (e) {
              console.log('PerfectScrollbar init prevented for:', element);
            }
          }
        };
      }
    });
  </script>
  <script src="../assets/js/material-dashboard.min.js?v=3.2.0"></script>
